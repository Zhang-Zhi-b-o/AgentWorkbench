[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentworkbench"
version = "0.1.0"
description = "A small self-hosted workbench that hosts independent plugins for remote use over a private network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "AgentWorkbench contributors" }]
keywords = ["workbench", "plugins", "remote", "tailscale", "zotero", "vscode"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
# The host and every bundled plugin use the standard library only.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Zhang-Zhi-b-o/AgentWorkbench"
Issues = "https://github.com/Zhang-Zhi-b-o/AgentWorkbench/issues"

[project.scripts]
# Convenience only: it serves ``web/`` and ``plugins/`` from the checkout this
# package lives in, so use ``pip install -e .`` (or ``python -m workbench``) --
# a plain ``pip install .`` would put them in site-packages and fail loudly.
workbench = "workbench.server:main"

[tool.setuptools]
packages = ["workbench", "plugins", "plugins.agents", "plugins.zotero", "plugins.vscode"]

[tool.pytest.ini_options]
# Without this, a bare ``pytest`` walks into installed runtimes (a VS Code server
# or a DSH install under data/) and collects their vendored tests.
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
