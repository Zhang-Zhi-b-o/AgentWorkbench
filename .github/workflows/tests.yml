name: tests

# Run this by hand from the Actions tab (Run workflow) until the account's
# Actions billing is sorted out; every push currently costs a red X without
# running a single test.  To get it back on push -- and a badge in the README --
# restore the triggers below and add this line near the top of README.md:
#
#   [![tests](https://github.com/Zhang-Zhi-b-o/AgentWorkbench/actions/workflows/tests.yml/badge.svg?branch=main)](https://github.com/Zhang-Zhi-b-o/AgentWorkbench/actions/workflows/tests.yml)
#
# on:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The host and every bundled plugin are standard-library only; pytest is
      # the single test-time dependency.
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q
