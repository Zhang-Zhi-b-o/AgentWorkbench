<!doctype html>
<!-- Zotero 阅读插件页：资料库列表、条目详情与 PDF 阅读器三种状态。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)">
  <title>Zotero 阅读 · 工作台</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="zotero-app">
    <header class="zp-header">
      <div class="zp-identity">
        <img class="zp-mark" src="../../favicon.svg" width="32" height="32" alt="">
        <div class="zp-title-block">
          <p class="zp-kicker">工作台 · 资料库</p>
          <h1>Zotero 阅读</h1>
        </div>
      </div>
      <div class="zp-header-actions">
        <span class="service-pill" id="servicePill" data-state="loading" role="status" aria-live="polite">
          <span class="service-dot" aria-hidden="true"></span>
          <span id="serviceText">连接中</span>
        </span>
        <button class="btn btn-quiet" id="backBtn" type="button" hidden>返回列表</button>
      </div>
    </header>

    <main class="zp-main">
      <section class="view library-view" id="libraryView" aria-label="资料库">
        <div class="library-layout">
          <aside class="collections-rail" aria-label="Zotero 分类">
            <div class="rail-heading">
              <span>分类</span>
              <span class="rail-hint">左右滑动</span>
            </div>
            <div class="collection-list" id="collectionList" role="group" aria-label="选择分类" aria-busy="true">
              <span class="rail-skeleton" aria-hidden="true"></span>
              <span class="rail-skeleton short" aria-hidden="true"></span>
              <span class="rail-skeleton" aria-hidden="true"></span>
            </div>
            <div class="rail-error" id="collectionError" role="alert" hidden>
              <p id="collectionErrorText">分类读取失败。</p>
              <button class="text-button" id="retryCollections" type="button">重试</button>
            </div>
          </aside>

          <section class="items-pane" aria-label="Zotero 条目">
            <div class="search-row">
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5"></circle>
                <path d="m16 16 4 4"></path>
              </svg>
              <label class="visually-hidden" for="searchInput">搜索条目</label>
              <input id="searchInput" type="search" inputmode="search" enterkeyhint="search"
                autocomplete="off" spellcheck="false" placeholder="搜索标题、作者或摘要">
              <button class="clear-search" id="clearSearch" type="button" aria-label="清除搜索" hidden>清除</button>
            </div>

            <div class="list-summary">
              <p id="listSummary" aria-live="polite">正在读取条目…</p>
              <span class="collection-current" id="activeCollection">全部条目</span>
            </div>

            <div class="inline-error" id="listError" role="alert" hidden>
              <div>
                <strong>服务不可用</strong>
                <p id="listErrorText"></p>
              </div>
              <button class="btn btn-small" id="retryList" type="button">重试</button>
            </div>

            <div class="list-skeleton" id="listSkeleton" aria-hidden="true">
              <div class="skeleton-row"><i></i><i></i><i></i></div>
              <div class="skeleton-row"><i></i><i></i><i></i></div>
              <div class="skeleton-row"><i></i><i></i><i></i></div>
              <div class="skeleton-row"><i></i><i></i><i></i></div>
              <div class="skeleton-row"><i></i><i></i><i></i></div>
            </div>

            <div class="item-list" id="itemList" aria-label="条目列表"></div>

            <div class="empty-state" id="emptyState" hidden>
              <span class="empty-mark" aria-hidden="true">0</span>
              <strong id="emptyTitle">没有找到条目</strong>
              <p id="emptyText">试试更换分类或搜索词。</p>
            </div>

            <div class="load-more-wrap" id="loadMoreWrap" hidden>
              <button class="btn load-more" id="loadMore" type="button">加载更多</button>
            </div>
          </section>
        </div>
      </section>

      <section class="view detail-view" id="detailView" hidden aria-label="条目详情">
        <div class="detail-skeleton" id="detailSkeleton" aria-hidden="true">
          <i class="skeleton-title"></i>
          <i class="skeleton-line"></i>
          <i class="skeleton-line short"></i>
          <div class="skeleton-panel"></div>
        </div>

        <div class="inline-error detail-error" id="detailError" role="alert" hidden>
          <div>
            <strong>服务不可用</strong>
            <p id="detailErrorText"></p>
          </div>
          <button class="btn btn-small" id="retryDetail" type="button">重试</button>
        </div>

        <div class="detail-layout" id="detailContent" hidden>
          <article class="detail-article">
            <div class="detail-topline">
              <button class="back-link" id="detailBack" type="button">← 返回列表</button>
              <span class="type-badge" id="detailType" hidden></span>
            </div>
            <h2 id="detailTitle"></h2>
            <p class="detail-authors" id="detailAuthors"></p>
            <dl class="detail-meta">
              <div><dt>出版</dt><dd id="detailPublication"></dd></div>
              <div><dt>日期</dt><dd id="detailDate"></dd></div>
              <div><dt>DOI</dt><dd id="detailDoi"></dd></div>
            </dl>
            <div class="tag-list" id="detailTags" aria-label="标签"></div>
            <section class="detail-section">
              <h3>摘要</h3>
              <p class="abstract" id="detailAbstract"></p>
            </section>
            <section class="detail-section">
              <h3>PDF 全文</h3>
              <div class="pdf-list" id="pdfList"></div>
            </section>
          </article>

          <aside class="translation-panel" aria-labelledby="translateTitle">
            <div class="translation-heading">
              <div>
                <p class="panel-kicker">AI 辅助</p>
                <h2 id="translateTitle">翻译</h2>
              </div>
              <span class="config-state" id="translationConfig">正在读取配置</span>
            </div>
            <div class="translation-state">
              <p class="panel-hint" id="translationHint"></p>
              <button class="text-button" id="retryTranslationConfig" type="button" hidden>重试</button>
            </div>

            <label class="field-label" for="translateText">待翻译文本</label>
            <textarea id="translateText" maxlength="12000" rows="7"
              placeholder="粘贴需要翻译的段落，最多 12000 个字符"></textarea>
            <div class="textarea-foot">
              <span id="charCount">0 / 12000</span>
              <span>最多 12000 字符</span>
            </div>

            <div class="translate-controls">
              <label class="select-field">
                <span>目标语言</span>
                <select id="targetLang">
                  <option value="zh">中文</option>
                  <option value="en">English</option>
                </select>
              </label>
              <button class="btn btn-primary" id="translateBtn" type="button" disabled>翻译</button>
            </div>

            <div class="inline-error translation-error" id="translationError" role="alert" hidden>
              <div>
                <strong>翻译失败</strong>
                <p id="translationErrorText"></p>
              </div>
              <button class="btn btn-small" id="retryTranslation" type="button">重试</button>
            </div>

            <div class="translation-output" id="translationOutput" hidden>
              <div class="output-heading">
                <span>译文</span>
                <span id="translationModel"></span>
              </div>
              <span class="cache-badge" id="cacheBadge" hidden>缓存命中</span>
              <p class="translation-text" id="translationText"></p>
              <button class="text-button" id="toggleTranslation" type="button" hidden>展开全部</button>
            </div>
          </aside>
        </div>
      </section>

      <section class="view reader-view" id="readerView" hidden aria-label="PDF 阅读器">
        <div class="reader-shell">
          <div class="reader-status" id="readerStatus">
            <span class="spinner" aria-hidden="true"></span>
            <span id="readerStatusText">正在载入阅读器…</span>
          </div>
          <div class="reader-host" id="readerHost"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
