<!doctype html>
<!-- Zotero 阅读插件页：资料库列表、条目详情、翻译与 PDF 阅读器。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)">
<title>Zotero 阅读 · 工作台</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../app.css?v=9">
<link rel="stylesheet" href="./app.css?v=9">
</head>
<body>
<div class="zotero-app">
<header class="zp-header">
<div class="zp-id"><img src="../../favicon.svg" width="30" height="30" alt=""><h1>Zotero 阅读</h1></div>
<div class="zp-actions"><button class="button back" id="backBtn" type="button" hidden>返回列表</button></div>
</header>
<main class="zp-main">
<section class="view library" id="libraryView" aria-label="资料库">
<div class="lib">
<aside class="rail" id="rail" aria-label="Zotero 目录">
<button class="rail-head" id="railHead" type="button" aria-expanded="true" aria-controls="collectionList" aria-label="选择目录" title="选择目录">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.4A1.4 1.4 0 0 1 5.4 6h3.4l1.2 1.7H18.6A1.4 1.4 0 0 1 20 9.1v8.5A1.4 1.4 0 0 1 18.6 19H5.4A1.4 1.4 0 0 1 4 17.6V7.4Z"/></svg>
<span class="rail-head-label" id="collectionCurrent">全部条目</span>
<span class="rail-head-caret" aria-hidden="true">▾</span>
</button>
<div class="rail-list" id="collectionList" role="group" aria-label="选择目录" aria-busy="true"><span class="rail-skeleton"></span></div>
<div class="rail-error" id="collectionError" role="alert" hidden><p id="collectionErrorText"></p><button class="text-button" id="retryCollections" type="button">重试</button></div>
</aside>
<section class="items" aria-label="Zotero 条目">
<div class="search">
<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
<label class="visually-hidden" for="searchInput">搜索条目</label>
<input id="searchInput" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="搜索标题、作者或摘要">
</div>
<div class="alert" id="listError" role="alert" hidden><div><b>服务不可用</b><p id="listErrorText"></p></div><button class="button small" id="retryList" type="button">重试</button></div>
<div class="skeleton" id="listSkeleton" aria-hidden="true"></div>
<div class="item-list" id="itemList" aria-label="条目列表"></div>
<div class="empty" id="emptyState" hidden><b id="emptyTitle">没有找到条目</b><p id="emptyText">试试更换分类或搜索词。</p></div>
<div class="more" id="loadMoreWrap" hidden><button class="button load" id="loadMore" type="button">加载更多</button></div>
</section>
</div>
</section>

<section class="view detail" id="detailView" hidden aria-label="条目详情">
<div class="detail-wrap">
<div class="detail-skeleton" id="detailSkeleton" aria-hidden="true"></div>
<div class="alert" id="detailError" role="alert" hidden><div><b>服务不可用</b><p id="detailErrorText"></p></div><button class="button small" id="retryDetail" type="button">重试</button></div>
<div class="detail-grid" id="detailContent" hidden>
<article class="paper">
<button class="text-button" id="detailBack" type="button">← 返回列表</button>
<h2 id="detailTitle"></h2>
<p class="authors" id="detailAuthors"></p>
<dl class="meta"><div><dt>出版</dt><dd id="detailPublication"></dd></div><div><dt>日期</dt><dd id="detailDate"></dd></div><div><dt>DOI</dt><dd id="detailDoi"></dd></div></dl>
<div class="tags" id="detailTags" aria-label="标签"></div>
<section class="section"><h3>摘要</h3><p class="abstract" id="detailAbstract"></p></section>
<section class="section"><h3>PDF 全文</h3><div class="pdfs" id="pdfList"></div></section>
</article>
</div>
</div>
</section>

<section class="view reader" id="readerView" hidden aria-label="PDF 阅读器">
<div class="reader-host" id="readerHost"></div>
</section>
</main>
</div>
<aside class="sel-card" id="selCard" role="dialog" aria-label="划词翻译" hidden>
<div class="sel-head"><b>划词翻译</b><span class="sel-meta" id="selMeta"></span><button class="sel-close" id="selClose" type="button" aria-label="关闭译文">×</button></div>
<p class="sel-text" id="selText" aria-live="polite"></p>
<div class="sel-foot"><span class="sel-src" id="selSource"></span><button class="text-button" id="selToggle" type="button" hidden>展开全部</button></div>
</aside>
<script src="./app.js?v=9" defer></script>
</body>
</html>
