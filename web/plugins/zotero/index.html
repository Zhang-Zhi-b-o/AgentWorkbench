<!doctype html>
<!-- Zotero 阅读插件页：资料库列表、条目详情、翻译与 PDF 阅读器。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)">
<title>Zotero 阅读 · 工作台</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="zotero-app">
<header class="zp-header">
<div class="zp-id"><img src="../../favicon.svg" width="30" height="30" alt=""><h1>Zotero 阅读</h1></div>
<div class="zp-actions"><span class="service" id="servicePill" data-state="loading" role="status"><i></i><span id="serviceText">连接中</span></span><button class="button back" id="backBtn" type="button" hidden>返回列表</button></div>
</header>
<main class="zp-main">
<section class="view library" id="libraryView" aria-label="资料库">
<div class="lib">
<aside class="rail" aria-label="Zotero 分类">
<p class="rail-title">分类</p>
<div class="rail-list" id="collectionList" role="group" aria-label="选择分类" aria-busy="true"><span class="rail-skeleton"></span></div>
<div class="rail-error" id="collectionError" role="alert" hidden><p id="collectionErrorText"></p><button class="text-button" id="retryCollections" type="button">重试</button></div>
</aside>
<section class="items" aria-label="Zotero 条目">
<div class="search">
<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
<label class="visually-hidden" for="searchInput">搜索条目</label>
<input id="searchInput" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="搜索标题、作者或摘要">
<button class="clear" id="clearSearch" type="button" aria-label="清除搜索" hidden>清除</button>
</div>
<div class="summary"><p id="listSummary" aria-live="polite">正在读取条目…</p><span id="activeCollection">全部条目</span></div>
<div class="alert" id="listError" role="alert" hidden><div><b>服务不可用</b><p id="listErrorText"></p></div><button class="button small" id="retryList" type="button">重试</button></div>
<div class="skeleton" id="listSkeleton" aria-hidden="true"></div>
<div class="item-list" id="itemList" aria-label="条目列表"></div>
<div class="empty" id="emptyState" hidden><b id="emptyTitle">没有找到条目</b><p id="emptyText">试试更换分类或搜索词。</p></div>
<div class="more" id="loadMoreWrap" hidden><button class="button load" id="loadMore" type="button">加载更多</button></div>
</section>
</div>
</section>

<section class="view detail" id="detailView" hidden aria-label="条目详情">
<div class="detail-wrap">
<div class="detail-skeleton" id="detailSkeleton" aria-hidden="true"></div>
<div class="alert" id="detailError" role="alert" hidden><div><b>服务不可用</b><p id="detailErrorText"></p></div><button class="button small" id="retryDetail" type="button">重试</button></div>
<div class="detail-grid" id="detailContent" hidden>
<article class="paper">
<button class="text-button" id="detailBack" type="button">← 返回列表</button>
<h2 id="detailTitle"></h2>
<p class="authors" id="detailAuthors"></p>
<dl class="meta"><div><dt>出版</dt><dd id="detailPublication"></dd></div><div><dt>日期</dt><dd id="detailDate"></dd></div><div><dt>DOI</dt><dd id="detailDoi"></dd></div></dl>
<div class="tags" id="detailTags" aria-label="标签"></div>
<section class="section"><h3>摘要</h3><p class="abstract" id="detailAbstract"></p></section>
<section class="section"><h3>PDF 全文</h3><div class="pdfs" id="pdfList"></div></section>
</article>
<aside class="trans" aria-labelledby="translateTitle">
<div class="trans-head"><h2 id="translateTitle">翻译</h2><span class="config" id="translationConfig">读取中</span></div>
<div class="trans-state"><p id="translationHint"></p><button class="text-button" id="retryTranslationConfig" type="button" hidden>重试</button></div>
<label class="field" for="translateText">待翻译文本</label>
<textarea id="translateText" maxlength="12000" rows="6" placeholder="粘贴需要翻译的段落，最多 12000 个字符"></textarea>
<div class="count"><span id="charCount">0 / 12000</span></div>
<div class="controls"><label><span>目标语言</span><select id="targetLang"><option value="zh">中文</option><option value="en">English</option></select></label><button class="button primary" id="translateBtn" type="button" disabled>翻译</button></div>
<div class="alert" id="translationError" role="alert" hidden><div><b>翻译失败</b><p id="translationErrorText"></p></div><button class="button small" id="retryTranslation" type="button">重试</button></div>
<div class="output" id="translationOutput" hidden><div class="out-head"><span>译文</span><span id="translationModel"></span></div><span class="cache" id="cacheBadge" hidden>缓存命中</span><p class="translation" id="translationText"></p><button class="text-button" id="toggleTranslation" type="button" hidden>展开全部</button></div>
</aside>
</div>
</div>
</section>

<section class="view reader" id="readerView" hidden aria-label="PDF 阅读器">
<div class="reader-status" id="readerStatus"><span class="spinner"></span><span id="readerStatusText">正在载入阅读器…</span></div>
<div class="reader-host" id="readerHost"></div>
</section>
</main>
</div>
<script src="./app.js" defer></script>
</body>
</html>
